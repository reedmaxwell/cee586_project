# Builds a self-contained ParFlow-CLM for Apple Silicon Macs from the class source
# (reedmaxwell/parflow, east-river-2026, pinned commit) and attaches the tarball to
# a release of this repository.  Students download it, unpack it, and run locally
# with no compiler and no Docker.
#
# The build steps follow parflow/parflow's own "macOS Release Build" workflow.
# Two things differ: the source is the pinned class commit, and the Python tools
# (pftools) are generated by the build and shipped in the tarball, because the
# PyPI release of pftools does not match this source.
#
# Run it by hand from the Actions tab.  NOT YET RUN: check the log on first use.
name: Build macOS binary

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the tarball to (the release is created if it does not exist)"
        default: "parflow-east-river-2026"

permissions:
  contents: write

env:
  PARFLOW_REPO: reedmaxwell/parflow
  PARFLOW_COMMIT: 1a084a5b1fe1711c0b8333f65f70539dc143b013
  ARCHIVE: parflow-east-river-2026-macos-arm64.tar.gz

jobs:
  build-and-package:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Check out the ParFlow source at the class commit
      uses: actions/checkout@v4
      with:
        repository: ${{ env.PARFLOW_REPO }}
        ref: ${{ env.PARFLOW_COMMIT }}

    - uses: fortran-lang/setup-fortran@v1
      with:
        compiler: gcc
    - uses: mpi4py/setup-mpi@v1
      with:
        mpi: openmpi
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: HDF5 Install
      run: brew install hdf5-mpi

    - name: TCL Link
      run: brew link tcl-tk@8

    - name: Cache dependencies
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: "~/depend"
        key: class-macos-15-netcdf-c4.10.0-netcdf-f4.6.1-hypre2.33.0

    - name: Directory Setup
      run: |
        mkdir -p $HOME/install
        mkdir -p $HOME/depend/{include,lib}
        echo "PARFLOW_DIR=$HOME/install" >> $GITHUB_ENV
        echo "PARFLOW_DEP_DIR=$HOME/depend" >> $GITHUB_ENV
        echo "$HOME/depend/bin" >> $GITHUB_PATH

    - name: NetCDF Install
      env:
        CACHE_HIT: ${{ steps.cache-deps.outputs.cache-hit }}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          URL=https://github.com/Unidata/netcdf-c/archive/v4.10.0.tar.gz
          mkdir netcdf-c && cd netcdf-c
          curl -L $URL | tar --strip-components=1 -xz
          CC=mpicc CPPFLAGS=-I/opt/homebrew/include LDFLAGS=-L/opt/homebrew/lib/ \
            ./configure --prefix=$PARFLOW_DEP_DIR
          make -j 3 && make install
          cd ..

          URL=https://github.com/Unidata/netcdf-fortran/archive/v4.6.1.tar.gz
          mkdir netcdf-fortran && cd netcdf-fortran
          curl -L $URL | tar --strip-components=1 -xz
          CC=mpicc FC=mpifort \
            CPPFLAGS=-I${PARFLOW_DEP_DIR}/include \
            LDFLAGS=-L${PARFLOW_DEP_DIR}/lib \
            ./configure --prefix=${PARFLOW_DEP_DIR}
          make -j 3 && make install
        fi
        echo "NETCDF_FLAGS=-DNETCDF_DIR=$PARFLOW_DEP_DIR -DPARFLOW_ENABLE_HDF5=TRUE" >> $GITHUB_ENV

    - name: HYPRE Install
      env:
        CACHE_HIT: ${{ steps.cache-deps.outputs.cache-hit }}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          URL=https://github.com/hypre-space/hypre/archive/v2.33.0.tar.gz
          mkdir hypre && cd hypre
          curl -L $URL | tar --strip-components=1 -xz
          cd src
          CC=mpicc CXX=mpic++ FC=mpif77 F77=mpif90 \
            ./configure --prefix=$PARFLOW_DEP_DIR
          make -j 3 install
        fi

    # The build generates pftools when PARFLOW_ENABLE_PYTHON is on.  It makes a
    # virtual environment at <prefix>/py-env for the generator and skips that step
    # when the environment exists, so it is made here first (same as the class
    # Dockerfile).  The environment is build-time only and is removed before packaging.
    - name: Generator environment for pftools
      run: |
        python3 -m venv "$PARFLOW_DIR/py-env"
        "$PARFLOW_DIR/py-env/bin/pip" install --no-cache-dir --upgrade pip wheel setuptools
        "$PARFLOW_DIR/py-env/bin/pip" install --no-cache-dir -r pftools/python/requirements_all.txt

    - name: ParFlow CMake Configure
      run: |
        CC=mpicc CXX=mpicxx F77=mpif77 FC=mpif90 \
          cmake -Bbuild \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wno-unused-result -Wno-unused-function" \
            -DPARFLOW_ENABLE_TIMING=TRUE \
            -DPARFLOW_AMPS_LAYER=mpi1 \
            -DPARFLOW_AMPS_SEQUENTIAL_IO=true \
            -DPARFLOW_HAVE_CLM=ON \
            -DPARFLOW_ENABLE_PYTHON=TRUE \
            -DPython3_EXECUTABLE="$(which python3)" \
            -DHYPRE_ROOT=$PARFLOW_DEP_DIR \
            $NETCDF_FLAGS \
            -DCMAKE_INSTALL_PREFIX=$PARFLOW_DIR \
            -DTCL_INCLUDE_PATH=/opt/homebrew/bin/usr/include \
            -DTCL_LIBRARY=/opt/homebrew/lib/libtcl8.6.dylib \
            -DTCL_TCLSH=/opt/homebrew/bin/tclsh8.6

    - name: ParFlow CMake Build and Install
      run: cmake --build build --parallel 3 --target install

    - name: Bundle shared libraries
      run: |
        chmod +x scripts/macos-bundle-deps.sh
        ./scripts/macos-bundle-deps.sh "$PARFLOW_DIR" "$PARFLOW_DEP_DIR"

    - name: Bundle OpenMPI runtime
      run: |
        PREFIXES=()
        for pkg in open-mpi pmix prrte libevent hwloc; do
          p="$(brew --prefix "$pkg" 2>/dev/null || true)"
          [[ -n "$p" && -d "$p" ]] && PREFIXES+=("$p")
        done

        for prefix in "${PREFIXES[@]}"; do
          for bin in mpirun mpiexec prterun prted; do
            src="${prefix}/bin/${bin}"
            if [[ -f "$src" ]]; then
              cp -L "$src" "$PARFLOW_DIR/bin/"
            fi
          done
        done

        for prefix in "${PREFIXES[@]}"; do
          for dir in share/openmpi share/prte share/pmix \
                     etc/openmpi etc/prte etc/pmix \
                     lib/openmpi lib/prte lib/pmix; do
            if [[ -d "${prefix}/${dir}" ]]; then
              mkdir -p "$PARFLOW_DIR/${dir}"
              cp -RL "${prefix}/${dir}/" "$PARFLOW_DIR/${dir}/"
            fi
          done
        done

        ./scripts/macos-bundle-deps.sh "$PARFLOW_DIR" "$PARFLOW_DEP_DIR" /opt/homebrew

    - name: Patch config for relocatable install
      run: |
        CFG="$PARFLOW_DIR/config/pf-cmake-env.sh"

        sed -i '' 's|^MPIEXEC=.*|MPIEXEC="${PARFLOW_DIR}/bin/mpiexec"|' "$CFG"

        echo '' >> "$CFG"
        echo '# Relocatable MPI stack: resolve share/etc/lib at runtime' >> "$CFG"
        echo 'export OPAL_PREFIX="${PARFLOW_DIR}"' >> "$CFG"
        echo 'export PMIX_PREFIX="${PARFLOW_DIR}"' >> "$CFG"
        echo 'export PRTE_PREFIX="${PARFLOW_DIR}"' >> "$CFG"
        echo '' >> "$CFG"
        echo '# Suppress PMIx compression warning (zlib plugin not available in bundled PMIx)' >> "$CFG"
        echo 'export PMIX_MCA_pcompress_base_silence_warning=1' >> "$CFG"

    - name: Drop the build-time Python environment, keep the generated pftools source
      run: |
        rm -rf "$PARFLOW_DIR/py-env"
        test -d "$PARFLOW_DIR/python" || { echo "pftools was not installed to $PARFLOW_DIR/python"; exit 1; }
        ls "$PARFLOW_DIR/python"

    - name: Fix permissions
      run: chmod -R u+w "$PARFLOW_DIR"

    - name: Smoke test
      run: |
        echo "--- Clearing Homebrew from PATH/DYLD to simulate a clean Mac ---"
        CLEAN_PATH="/usr/bin:/bin:/usr/sbin:/sbin:${PARFLOW_DIR}/bin"
        env -i HOME="$HOME" PATH="$CLEAN_PATH" TMPDIR="$TMPDIR" \
          PARFLOW_DIR="$PARFLOW_DIR" \
          "$PARFLOW_DIR/bin/parflow" -v
        echo "--- pftools installs from the bundled source ---"
        python3 -m venv "$RUNNER_TEMP/pftest"
        "$RUNNER_TEMP/pftest/bin/pip" install --quiet "$PARFLOW_DIR/python"
        "$RUNNER_TEMP/pftest/bin/python" -c "import parflow; from parflow.tools import hydrology; print('pftools ok')"
        rm -rf "$PARFLOW_DIR/python/build" "$PARFLOW_DIR/python"/*.egg-info
        echo "Smoke test passed."

    - name: Create tarball
      run: |
        cp README-MACOS-BINARY.md "$PARFLOW_DIR/" 2>/dev/null || true
        tar -C "$(dirname "$PARFLOW_DIR")" -czf "${ARCHIVE}" "$(basename "$PARFLOW_DIR")"
        ls -lh "${ARCHIVE}"

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: parflow-east-river-2026-macos-arm64
        path: ${{ env.ARCHIVE }}

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.release_tag }}
      run: |
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "ParFlow-CLM for the class project (east-river-2026)" \
            --notes "Self-contained ParFlow-CLM for Apple Silicon Macs, built from ${PARFLOW_REPO} at ${PARFLOW_COMMIT}.  See the README for how to install it."
        gh release upload "$TAG" "${ARCHIVE}" --repo "$GITHUB_REPOSITORY" --clobber
